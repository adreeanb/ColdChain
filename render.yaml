# Blueprint do Render: API (Web Service) e painel (Static Site). Passo a passo em docs/DEPLOY.md.
# Segredos ficam só no painel do Render (sync: false); nada sensível neste arquivo.
services:
  - type: web
    name: coldchain-api
    runtime: node
    # Free: o serviço dorme após 15 min sem tráfego HTTP e para o MQTT, os jobs e o SSE.
    # Mantenha-o acordado com um monitor de uptime em /health a cada 5 min (docs/DEPLOY.md).
    plan: free
    # Mais perto do Supabase em us-east-1 (N. Virginia)
    region: virginia
    rootDir: api
    # --include=dev: com NODE_ENV=production o npm pularia o prisma e o typescript, usados no build.
    # Sem migrations aqui: o ambiente de build do Render não alcança o Supabase (P1001). Elas são
    # aplicadas da máquina do desenvolvedor antes do deploy (docs/DEPLOY.md, seção 3).
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    # Uma única instância: o barramento de eventos (SSE) é em memória
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: MQTT_CLIENT_ID
        value: coldchain-api
      # Valor aleatório gerado pelo Render (256 bits)
      - key: JWT_SECRET
        generateValue: true
      # Session pooler do Supabase (porta 5432) com ?sslmode=verify-full&sslrootcert=certs/supabase-ca.crt
      - key: DATABASE_URL
        sync: false
      # https://<nome-do-static-site>.onrender.com
      - key: CORS_ORIGINS
        sync: false
      # mqtts://<id>.<região>.emqxsl.com:8883
      - key: MQTT_BROKER_URL
        sync: false
      # Usuário da API na EMQX Cloud Serverless (só assinatura)
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false

  - type: web
    name: coldchain-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # https://<nome-da-api>.onrender.com (lido no build pelo Vite)
      - key: VITE_API_URL
        sync: false
    # SPA: qualquer rota que não seja arquivo cai no index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(), geolocation=()
