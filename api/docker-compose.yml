# Nome fixo: sem ele o projeto seria o nome da pasta, e uma pasta renomeada criaria volumes novos (banco vazio)
name: coldchain_api

services:
  postgres:
    image: postgres:16
    container_name: meu-postgres
    restart: unless-stopped

    # Credenciais do .env: nada de senha fixa no repositório
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no .env}

    # Só nesta máquina: o banco nunca fica exposto na rede
    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Broker MQTT próprio, com usuário e senha (as variáveis vêm do .env)
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: coldchain-mosquitto
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/mosquitto/config/entrypoint.sh"]

    environment:
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_DEVICE_USERNAME: ${MQTT_DEVICE_USERNAME}
      MQTT_DEVICE_PASSWORD: ${MQTT_DEVICE_PASSWORD}

    ports:
      - "1883:1883"

    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/entrypoint.sh:/mosquitto/config/entrypoint.sh:ro
      - mosquitto_data:/mosquitto/data

volumes:
  postgres_data:
  mosquitto_data:
