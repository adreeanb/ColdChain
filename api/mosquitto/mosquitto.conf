# Broker do ColdChain: só usuários com senha, cada um com o que pode ler ou publicar
listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/data/acl

# Sessão persistente da API: as leituras ficam guardadas enquanto ela estiver fora do ar.
# O ESP32 (PubSubClient) só publica em QoS 0, por isso a fila precisa incluir QoS 0.
persistence true
persistence_location /mosquitto/data/
queue_qos0_messages true
max_queued_messages 100000

log_dest stdout
